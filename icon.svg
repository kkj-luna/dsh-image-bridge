<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Image Bridge">
  <!--
    插件列表/市场里显示的图标：**黑底 + 渐变蓝图形**。

    配色取舍：底色用近黑（#111318，略偏蓝以免在纯黑主题里"浮"起来），图形用一条从上到下的
    蓝色渐变（亮天蓝到品牌蓝）。这样在插件列表那种深色底上，图标是一块清晰的深色圆角砖，
    图形自己发光；而纯蓝底白图在深色列表里会显得比邻居更亮、更"跳"。

    渐变必须写成 <linearGradient> 并用 id 引用：mask-image 只读 alpha，颜色不影响
    设置页导航那一行；列表页与市场页读的是本文件的真实颜色。

    注意分工：
      · 本文件（icon.svg）是**品牌图标**，允许带颜色，插件列表读的就是它；
      · 设置页左侧导航那一行**不读这里的颜色**：它用 client.js 里内联的 `GLYPH_SHAPES`
        几何数据 + CSS mask-image（mask 只读 alpha，颜色来自 currentColor），
        所以内联图形必须保持 currentColor / fill=none。
      · 两处的**几何数据必须逐条一致**（验收里有跨文件断言盯着），所以下面那组
        图形元素的几何值任何一处都不要单独改；改配色只动 fill / stroke / 渐变定义。

    写给以后的维护者：**注释里不能出现连续两个连字符**。XML 规范禁止它，GitHub 的
    sanitizer 与 librsvg 都会因此拒绝整个文件；浏览器宽容，所以本机看不出问题，只有
    "README 里内嵌这个 SVG 变成破图"这种远端现象才会暴露。说明文字里请用「两个短横」
    这类措辞代替，别直接把那两个字符写出来。
  -->
  <defs>
    <linearGradient id="dib-icon-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecdff" />
      <stop offset="1" stop-color="#4a9eff" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="24" height="24" rx="5.5" fill="#111318" />
  <g id="dib-icon-glyph" fill="none" stroke="url(#dib-icon-gradient)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="3" />
    <circle cx="8.2" cy="8.8" r="1.5" />
    <path d="M4.6 16.6h14.8" />
    <path d="M7.6 16.6c0-2.5 1.9-4.2 4.4-4.2s4.4 1.7 4.4 4.2" />
    <path d="M7.6 16.6V20" />
    <path d="M16.4 16.6V20" />
  </g>
</svg>
